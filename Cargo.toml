[package]
name = "tcsh-lsp"
version = "0.1.0"
edition = "2024"
description = "A conservative Language Server Protocol implementation for tcsh/csh scripts."
license = "MIT OR Apache-2.0"
repository = ""
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
anyhow = "1"

[[bin]]
name = "tcsh-lsp"
path = "src/main.rs"
